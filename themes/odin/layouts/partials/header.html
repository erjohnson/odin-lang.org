<header class="sticky-top">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary odin-menu">
        <div class="container-xxl">
            <a class="navbar-brand" href="/">
                {{ if .IsHome }}
                    <img src="/logo.svg" height="30" alt="Odin" id="navbar-logo" class="d-none" />
                {{ else }}
                    <img src="/logo.svg" height="30" alt="Odin" id="navbar-logo" />
                {{ end }}
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#odin-navbar-content"
                aria-controls="odin-navbar-content"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="odin-navbar-content">
                <ul class="navbar-nav ms-md-auto">
                    {{ $currentPage := . }}
                    {{ range .Site.Menus.main }}
                    <li class="nav-item">
                        <!-- NOTE(Wojciech): This is not the way they tell you to do this in the docs but the way in the docs is broken.
                        Presumably we can change this when they fix it (haven't for 3 years). -->
                        {{ $active := or (eq $currentPage.RelPermalink .URL) (and (in $currentPage.RelPermalink .URL) (ne .URL "/")) }}
                        <a
                            class="nav-link{{if $active}} active{{end}}"
                            href="{{.URL}}"
                            {{if $active}}aria-current="page"{{end}}
                            {{if in .URL "github.com"}}target="_blank"{{end}}
                            >{{.Name}}</a
                        >
                    </li>
                    {{ end }}
                    <li class="nav-item dropdown">
                      <button class="btn btn-link nav-link py-2 px-0 px-lg-2 dropdown-toggle d-flex align-items-center"
                              id="bd-theme"
                              type="button"
                              aria-expanded="false"
                              data-bs-toggle="dropdown"
                              data-bs-display="static"
                              aria-label="Toggle theme (auto)">
                        <svg width="16" height="16" class="bi my-1 theme-icon-active" fill="currentColor"><use href="#circle-half"></use></svg>
                        <span class="d-lg-none ms-2" id="bd-theme-text">Toggle theme</span>
                      </button>
                      <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="bd-theme-text">
                        <li>
                          <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="light" aria-pressed="false">
                            <svg width="16" height="16" class="bi me-2 opacity-50" fill="currentColor"><use href="#sun-fill"></use></svg>
                            Light
                            <svg width="16" height="16" class="bi ms-auto d-none" fill="currentColor"><use href="#check2"></use></svg>
                          </button>
                        </li>
                        <li>
                          <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="dark" aria-pressed="false">
                            <svg width="16" height="16" class="bi me-2 opacity-50" fill="currentColor"><use href="#moon-stars-fill"></use></svg>
                            Dark
                            <svg width="16" height="16" class="bi ms-auto d-none" fill="currentColor"><use href="#check2"></use></svg>
                          </button>
                        </li>
                        <li>
                          <button type="button" class="dropdown-item d-flex align-items-center active" data-bs-theme-value="auto" aria-pressed="true">
                            <svg width="16" height="16" class="bi me-2 opacity-50" fill="currentColor"><use href="#circle-half"></use></svg>
                            Auto
                            <svg width="16" height="16" class="bi ms-auto d-none" fill="currentColor"><use href="#check2"></use></svg>
                          </button>
                        </li>
                      </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
